name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发：只构建产物并作为 workflow artifact 上传，不创建 Release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - name: Windows (x64)
            platform: windows-latest
            args: ''
            targets: ''
          # glibc 基线：必须在 22.04 上构建，产物才能覆盖 Ubuntu 22.04+ / Debian 12+。
          # 用 ubuntu-latest（当前 24.04）会把最低 glibc 抬到 2.39，22.04 用户直接跑不起来。
          - name: Linux (x64)
            platform: ubuntu-22.04
            args: ''
            targets: ''
    env:
      # 签名密钥（docs/08 §4.4）：createUpdaterArtifacts 需要它来产出 .sig。
      # 没有口令时 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 留空即可。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # linuxdeploy 自身也是 AppImage；GitHub runner 曾移除 libfuse2，这里强制解包运行。
      APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2 rpm xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅在推送 tag 时创建 Release；手动触发时留空 → 只构建
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('tree-todo {0}', github.ref_name) || '' }}
          # 占位正文；tag 构建结束后由 publish-manifest job 用 release-notes/<tag>.md 覆盖
          releaseBody: |
            **tree-todo ${{ github.ref_name }}**

            安装包与更新说明见本页附件；完整更新日志见
            [CHANGELOG.md](https://github.com/Jeysin/tree-todo/blob/main/CHANGELOG.md)。
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          # latest.json 由 publish-manifest job 统一生成：
          # macOS universal 必须同时写 darwin-aarch64 与 darwin-x86_64 两个键；
          # Linux 统一写 linux-x86_64（deb/rpm/AppImage 都会回落到这个键）。
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      # 断言关键产物真的落地，避免签名密钥缺失 / AppImage 打包失败时静默发版。
      - name: Verify Linux bundles
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          ls -lh \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tree-todo-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.sig
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.sig
          if-no-files-found: error

  # 生成并上传 Tauri updater 的静态清单（docs/08 §7.2）。
  publish-manifest:
    name: Publish updater manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync release notes
        run: gh release edit "$TAG" --notes-file "release-notes/$TAG.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Generate latest.json
        run: node scripts/updater-manifest.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Upload latest.json
        run: gh release upload "$TAG" latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  # 这里刻意没有「镜像到 Gitee」的 job —— 详见 docs/09-gitee-release.md §7。
  #
  # GitHub 的 runner 都在海外，往 gitee.com 上传大文件会被跨境链路拖死（不是慢，是卡住）：
  # v2.1.0 实测 4.58MB 的 .rpm 传了 39 分钟仍未完成，只有几 KB 的 latest.json 过得去；
  # 加超时、加重试、换 curl 都没用，因为瓶颈在链路层不在客户端。
  # v1.0.0 / v2.0.0 的 Gitee 附件其实一直是本地跑 `pnpm release:gitee` 补的
  # （国内出口同一批 109MB 约 20 秒），只是当时 release.yml 还没有这个 job，
  # 所以没人发现自动镜像这条路走不通。
  #
  # 结论：Gitee 镜像在发版后由本机执行，不放进 CI。
