<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif">
  <rect width="1200" height="520" fill="#f7f8fa"/>

  <text x="48" y="56" font-size="20" font-weight="600" fill="#1a1d23">AI Agent 协同：指派 → 执行 → 验收</text>
  <text x="48" y="84" font-size="13" fill="#6b7280">Agent 只在中间环节出现；任务算不算完成，永远由人决定。</text>

  <!-- 卡片 1 -->
  <g>
    <rect x="48" y="118" width="330" height="252" rx="14" fill="#ffffff" stroke="#e2e5ea"/>
    <rect x="48" y="118" width="330" height="4" rx="2" fill="#2f6fed"/>
    <text x="76" y="162" font-size="12" font-weight="600" fill="#2f6fed" letter-spacing="0.5">① 指派</text>
    <text x="76" y="196" font-size="17" font-weight="600" fill="#1a1d23">在 Tree Todo 里选任务</text>
    <circle cx="82" cy="232" r="3" fill="#2f6fed"/>
    <text x="94" y="237" font-size="13" fill="#4b5563">右键「复制 Prompt（带回执）」</text>
    <circle cx="82" cy="264" r="3" fill="#2f6fed"/>
    <text x="94" y="269" font-size="13" fill="#4b5563">节点 ID 与完成协议随 Prompt 下发</text>
    <circle cx="82" cy="296" r="3" fill="#2f6fed"/>
    <text x="94" y="301" font-size="13" fill="#4b5563">多选可整段复制，一段一个任务</text>
    <text x="76" y="344" font-size="12" fill="#9ca3af">纯文本变体不含任何工具痕迹</text>
  </g>

  <!-- 卡片 2 -->
  <g>
    <rect x="434" y="118" width="330" height="252" rx="14" fill="#ffffff" stroke="#e2e5ea"/>
    <rect x="434" y="118" width="330" height="4" rx="2" fill="#d97706"/>
    <text x="462" y="162" font-size="12" font-weight="600" fill="#d97706" letter-spacing="0.5">② 执行</text>
    <text x="462" y="196" font-size="17" font-weight="600" fill="#1a1d23">粘贴给任意 Agent</text>
    <circle cx="468" cy="232" r="3" fill="#d97706"/>
    <text x="480" y="237" font-size="13" fill="#4b5563">Trae / Claude Code / Codex …</text>
    <circle cx="468" cy="264" r="3" fill="#d97706"/>
    <text x="480" y="269" font-size="13" fill="#4b5563">开工前调 tree_todo_start</text>
    <circle cx="468" cy="296" r="3" fill="#d97706"/>
    <text x="480" y="301" font-size="13" fill="#4b5563">干完调 tree_todo_complete_tasks</text>
    <text x="462" y="344" font-size="12" fill="#9ca3af">工具用不了就跳过回执，不影响干活</text>
  </g>

  <!-- 卡片 3 -->
  <g>
    <rect x="820" y="118" width="330" height="252" rx="14" fill="#ffffff" stroke="#e2e5ea"/>
    <rect x="820" y="118" width="330" height="4" rx="2" fill="#16a34a"/>
    <text x="848" y="162" font-size="12" font-weight="600" fill="#16a34a" letter-spacing="0.5">③ 验收</text>
    <text x="848" y="196" font-size="17" font-weight="600" fill="#1a1d23">回到树上一键验收</text>
    <circle cx="854" cy="232" r="3" fill="#16a34a"/>
    <text x="866" y="237" font-size="13" fill="#4b5563">节点变「待验收」，耗时留在树上</text>
    <circle cx="854" cy="264" r="3" fill="#16a34a"/>
    <text x="866" y="269" font-size="13" fill="#4b5563">你点完成才真正 done，并向上传播</text>
    <circle cx="854" cy="296" r="3" fill="#16a34a"/>
    <text x="866" y="301" font-size="13" fill="#4b5563">驳回则退回待处理，可再指派一轮</text>
    <text x="848" y="344" font-size="12" fill="#9ca3af">MCP 工具集里没有「勾选」能力</text>
  </g>

  <!-- 箭头（画在卡片之上，避免被卡片盖住） -->
  <g stroke="#b9c0cc" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M384 244 H 420"/>
    <path d="M413 238 L 421 244 L 413 250"/>
    <path d="M770 244 H 806"/>
    <path d="M799 238 L 807 244 L 799 250"/>
  </g>
  <text x="402" y="228" font-size="11" fill="#6b7280" text-anchor="middle">粘贴</text>
  <text x="788" y="228" font-size="11" fill="#6b7280" text-anchor="middle">回执</text>

  <!-- 底部条 -->
  <g>
    <rect x="48" y="398" width="1102" height="76" rx="12" fill="#ffffff" stroke="#e2e5ea"/>
    <circle cx="78" cy="436" r="4" fill="#16a34a"/>
    <text x="94" y="441" font-size="12.5" fill="#4b5563">本机 MCP over HTTP</text>
    <text x="234" y="441" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a1d23">http://127.0.0.1:39401/mcp</text>
    <line x1="462" y1="422" x2="462" y2="450" stroke="#e2e5ea"/>
    <text x="482" y="441" font-size="12.5" fill="#4b5563">Bearer token 持久化，配置一次长期有效</text>
    <line x1="832" y1="422" x2="832" y2="450" stroke="#e2e5ea"/>
    <text x="852" y="441" font-size="12.5" fill="#4b5563">Agent 只能推进到「待验收」，不能替你勾选</text>
  </g>
</svg>
